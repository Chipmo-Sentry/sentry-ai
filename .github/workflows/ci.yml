name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    name: Lint + type-check + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.16"
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies (frozen)
        run: uv sync --frozen

      - name: Install ffmpeg (needed for pipeline.frames sanity)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Ruff — format check
        run: uv run ruff format --check .

      - name: Ruff — lint
        run: uv run ruff check .

      - name: Mypy — strict type-check
        run: uv run mypy src/sentry_ai

      - name: Pytest — unit tests (Ollama mocked via respx)
        # Integration tests require a real Ollama with model loaded — skipped here.
        run: uv run pytest tests/unit/ -v
