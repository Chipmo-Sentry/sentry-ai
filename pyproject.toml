[project]
name = "sentry-ai"
version = "0.1.0"
description = "Chipmo Sentry AI inference — YOLO Stage 1 + VLM Stage 2 (via Ollama)"
readme = "README.md"
requires-python = "==3.11.*"
license = { text = "Apache-2.0" }
authors = [{ name = "Tuguldur Enkhtuvshin", email = "tuguldur.enkhtuvshin@yahoo.com" }]

dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30,<0.40",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "httpx>=0.27,<0.30",
    "structlog>=24.2,<26.0",
    "ffmpeg-python>=0.2.0,<0.3",
    "pillow>=10.0,<12.0",
    "jinja2>=3.1,<4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-mock>=3.14,<4.0",
    "pytest-cov>=5.0,<7.0",
    "respx>=0.21,<1.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentry_ai"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "A", "C4",
    "PIE", "T20", "RET", "SIM", "ARG", "PTH", "ASYNC",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "S101"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["sentry_ai"]

[[tool.mypy.overrides]]
module = ["ffmpeg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --strict-markers"
markers = [
    "integration: requires real Ollama (set OLLAMA_BASE_URL)",
]
