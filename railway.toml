# Railway deployment config

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Required env vars (set in Railway dashboard):
#   OLLAMA_BASE_URL              — http://<hetzner-gpu-host>:11434
#                                  M1 dev: laptop via Cloudflare Tunnel
#                                  M2+: Hetzner GEX44 with RTX 4000
#   DEFAULT_PROVIDER             — "minicpm-v-2.6" or "qwen2.5-vl-7b"
#   INFERENCE_TIMEOUT_SEC=30
#   SENTRY_BACKEND_URL           — for /api/v1/internal/alerts back-channel (M2)
#   SENTRY_BACKEND_SERVICE_TOKEN — printed by sentry-backend on startup
#   ENVIRONMENT=production
#   LOG_LEVEL=INFO
